# Build the static site from data/bloom.json and publish it on GitHub Pages.
# Runs on every push to main. The daily job (PLAN.md §2 step 7) will take
# over the redeploys once it exists.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"   # same as the local venv
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.build_site
      - run: python -m pipeline.share_cards   # Chrome is preinstalled on the runner
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
