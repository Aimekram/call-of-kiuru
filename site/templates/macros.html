{# Signal bars for a track-record grade: level 1, 2 or 3 of three filled. #}
{% macro grade_bars(level) %}<svg class="bars" viewBox="0 0 14 12" aria-hidden="true">{% for i in range(3) %}<rect{{ {'class': 'on' if i < level else 'off'}|xmlattr }} x="{{ i * 5 }}" y="{{ 8 - i * 4 }}" width="3.5" height="{{ 4 + i * 4 }}" rx="1"/>{% endfor %}</svg>{% endmacro %}

{# The logo: a small Meadow card, waves spreading from a lilac sprig in its corner. Colours follow the theme. #}
{% macro logo() %}<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="logo-card"><rect x="6" y="6" width="82" height="82" rx="15"/></clipPath><path id="logo-leaf" d="M0,0 C8,-15 34,-17 50,-2 C34,10 10,12 0,0Z"/></defs><rect x="12" y="12" width="82" height="82" rx="15" fill="var(--ink)" stroke="var(--ink)" stroke-width="3.5"/><rect x="6" y="6" width="82" height="82" rx="15" fill="var(--card)"/><g clip-path="url(#logo-card)"><g fill="none" stroke="currentColor"><circle class="ring" cx="28" cy="68" r="27" stroke-width="9" opacity=".82"/><circle class="ring" cx="28" cy="68" r="43" stroke-width="7" opacity=".64"/><circle class="ring" cx="28" cy="68" r="60" stroke-width="9" opacity=".48"/></g><g fill="currentColor"><use href="#logo-leaf" transform="translate(17 75) rotate(-16) scale(.5 -.5)"/><use href="#logo-leaf" transform="translate(17 75) rotate(-58) scale(.42)" stroke="var(--card)" stroke-width="5.7" stroke-linejoin="round" paint-order="stroke"/></g><path d="M3 91L17.5 74.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></g><rect x="6" y="6" width="82" height="82" rx="15" fill="none" stroke="var(--ink)" stroke-width="3.5"/></svg>{% endmacro %}
