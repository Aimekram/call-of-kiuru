<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <!-- Profile picture: logo X2 on paper, small enough to survive a circular crop. -->
  <defs>
    <path id="leaf" d="M0,0 C8,-15 34,-17 50,-2 C34,10 10,12 0,0Z"/>
    <clipPath id="card"><rect x="6" y="6" width="82" height="82" rx="15"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="#f8f1d5"/>
  <g transform="translate(50 50) scale(.7) translate(-50 -50)">
    <rect x="12" y="12" width="82" height="82" rx="15" fill="#221e18" stroke="#221e18" stroke-width="3.5"/>
    <rect x="6" y="6" width="82" height="82" rx="15" fill="#fffae6"/>
    <g clip-path="url(#card)">
      <g fill="none" stroke="#409d48">
        <circle cx="28" cy="68" r="27" stroke-width="9" opacity=".82"/>
        <circle cx="28" cy="68" r="43" stroke-width="7" opacity=".64"/>
        <circle cx="28" cy="68" r="60" stroke-width="9" opacity=".48"/>
      </g>
      <g fill="#409d48">
        <use href="#leaf" xlink:href="#leaf" transform="translate(17 75) rotate(-16) scale(.5 -.5)"/>
        <use href="#leaf" xlink:href="#leaf" transform="translate(17 75) rotate(-58) scale(.42)" stroke="#fffae6" stroke-width="5.7" stroke-linejoin="round" paint-order="stroke"/>
      </g>
      <path d="M3 91L17.5 74.5" stroke="#409d48" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <rect x="6" y="6" width="82" height="82" rx="15" fill="none" stroke="#221e18" stroke-width="3.5"/>
  </g>
</svg>
